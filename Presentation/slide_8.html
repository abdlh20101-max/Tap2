<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شكر وتقدير - GamesHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; overflow: hidden; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            box-sizing: border-box;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .content-card {
            background-color: #FFFFFF;
            padding-top: 60px;
            padding-left: 80px;
            padding-right: 80px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 70%;
            max-width: 900px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 64px;
            color: #FF4757;
            margin-bottom: 20px;
        }
        .decorative-divider {
            width: 150px;
            height: 8px;
            background-color: #1E90FF;
            border-radius: 4px;
            margin-bottom: 40px;
        }
        .info-section {
            margin-top: 20px;
        }
        .info-item {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 24px;
            color: #1A1A24;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .link-text {
            color: #1E90FF;
            text-decoration: none;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-card">
            <h1>شكراً لكم!</h1>
            <div class="decorative-divider"></div>
            <div class="info-section">
                <p class="info-item">
                    <strong>للتواصل والاستفسار:</strong><br>
                    <span class="link-text">abdlh20101-max@example.com</span>
                </p>
                <p class="info-item">
                    <strong>المستودع على GitHub:</strong><br>
                    <span class="link-text">https://github.com/abdlh20101-max/Tap2.git</span>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
