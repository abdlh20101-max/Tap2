<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; overflow: hidden; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            box-sizing: border-box;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .title-box {
            background-color: #FFFFFF;
            padding: 40px 80px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
        }
        .main-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 64px;
            color: #FF4757;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .sub-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 32px;
            color: #1A1A24;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .tagline {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 20px;
            color: #1E90FF;
            line-height: 1.4;
        }
        .decorative-line {
            width: 200px;
            height: 8px;
            background-color: #1E90FF;
            border-radius: 4px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="title-box">
            <h1 class="main-title">GamesHub</h1>
            <div class="decorative-line"></div>
            <h2 class="sub-title">منصة الألعاب العالمية المتكاملة</h2>
            <p class="tagline">رؤيتنا: عالم من الترفيه اللامحدود في جيبك</p>
        </div>
    </div>
</body>
</html>
